<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EngiBuddy — 3D study companion</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- Sessions sidebar -->
  <aside id="sidebar">
    <div class="sidebar-head">
      <span class="logo">⚡ EngiBuddy</span>
      <button id="new-chat" title="New chat">＋</button>
    </div>
    <nav id="session-list"></nav>
    <footer id="sidebar-foot"></footer>
  </aside>
  <button id="sidebar-toggle" title="Sessions">☰</button>

  <!-- Chat pane -->
  <main id="chat-pane">
    <div id="messages">
      <div class="welcome">
        <h1>⚡ EngiBuddy</h1>
        <p>Your engineering study companion — ask about any concept and I can
           explain it with a live, interactive 3D model.</p>
        <div class="starters">
          <button class="starter">Explain how an NPN transistor works, in 3D</button>
          <button class="starter">Show me a NAND gate I can play with</button>
          <button class="starter">How do gear ratios work? Show me</button>
          <button class="starter">Explain simple harmonic motion with a spring</button>
        </div>
      </div>
    </div>

    <div id="quick-actions">
      <button data-qa="practice">📝 Practice problems</button>
      <button data-qa="summary">• Bullet summary</button>
      <button data-qa="realworld">🌍 Real-world use</button>
      <button data-qa="show3d">🧊 Show me in 3D</button>
      <button data-qa="different" hidden id="qa-different">🔄 Explain differently</button>
      <button data-qa="projects">💡 Project ideas</button>
    </div>

    <form id="composer">
      <textarea id="input" rows="1" placeholder="Ask about any engineering concept…"
                autocomplete="off"></textarea>
      <button id="send" type="submit" title="Send">➤</button>
    </form>
  </main>

  <!-- 3D pane -->
  <section id="viewer-pane">
    <div id="viewer-head">
      <span id="scene-title">3D view</span>
      <span class="viewer-controls">
        <button id="lowpoly-toggle" title="Toggle low-power rendering">⚙ quality</button>
        <button id="viewer-close" title="Hide 3D view">✕</button>
      </span>
    </div>
    <div id="viewer"></div>
    <div id="viewer-hint">drag to rotate · scroll / pinch to zoom · click switches to toggle</div>
  </section>
  <button id="viewer-open" hidden>🧊 3D view</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
